name: CI and Release

on:
  push:
    branches: [develop, release]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.2']

    # Disposable MySQL for the migration import test. The password is a throwaway CI value.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: horizon-ci
          MYSQL_DATABASE: task691_0c1
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -phorizon-ci"
          --health-interval=5s --health-timeout=5s --health-retries=24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Run integration tests
        run: bash tests/test.sh

      - name: Run migration import test on MySQL
        run: php tests/migration-import.php
        env:
          HORIZON_MIGRATION_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=task691_0c1;charset=utf8mb4
          HORIZON_MIGRATION_TEST_USER: root
          HORIZON_MIGRATION_TEST_PASSWORD: horizon-ci

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release plugins
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release output
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "New release published: ${{ steps.semantic.outputs.new_release_version }}"

      - name: Trigger changelog sync
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh api repos/ProjectMakersDE/horizOn-Changelog/dispatches \
            -f event_type=sync-changelog \
            -f 'client_payload[source]=simple-server'
